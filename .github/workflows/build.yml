name: Build LineageOS for hlte (Galaxy Note 3 LTE)

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS branch (örn. lineage-18.1)'
        required: true
        default: 'lineage-18.1'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350  # GitHub free runner sınırı 360dk
    steps:
      # 1) Disk alanını büyüt - Android derlemesi için runner'ın varsayılan
      #    ~14GB diski yetersiz. Bu adım /mnt altına ek alan açar.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: /mnt/android

      - name: Sembolik link ile workspace'i büyük diske taşı
        run: |
          sudo mkdir -p /mnt/android/lineage
          sudo chown -R $USER:$USER /mnt/android
          mkdir -p ~/android
          ln -s /mnt/android/lineage ~/android/lineage

      # 2) Bağımlılıkları kur
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync ccache

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      # 3) Checkout - kendi repo'muz (manifest + özelleştirme dosyaları için)
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: build-config

      # 4) LineageOS kaynağını çek
      - name: Repo init
        working-directory: /mnt/android/lineage
        run: |
          repo init -u https://github.com/LineageOS/android.git \
            -b ${{ github.event.inputs.lineage_branch }} --git-lfs --depth=1

      - name: Local manifest ekle
        run: |
          mkdir -p /mnt/android/lineage/.repo/local_manifests
          cp build-config/local_manifests/roomservice.xml /mnt/android/lineage/.repo/local_manifests/

      - name: Repo sync
        working-directory: /mnt/android/lineage
        run: |
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      # 5) ÖZELLEŞTİRME ADIMLARI - burada kaynak kodu değiştiriyoruz
      - name: Apply customizations
        run: |
          bash build-config/customization/apply.sh /mnt/android/lineage

      # 6) Build
      - name: Build LineageOS
        working-directory: /mnt/android/lineage
        run: |
          source build/envsetup.sh
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 20G
          breakfast hlte
          brunch hlte

      # 7) Çıktıyı yükle
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-hlte-build
          path: |
            /mnt/android/lineage/out/target/product/hlte/lineage-*.zip
          retention-days: 14

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: /mnt/android/lineage/out/target/product/hlte/lineage-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}